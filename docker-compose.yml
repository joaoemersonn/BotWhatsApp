services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_bot
    restart: unless-stopped
    # Carrega variáveis de ambiente a partir do arquivo .env
    env_file:
      - .env
    # Expõe a porta da API HTTP para envio ativo de mensagens e relatórios
    ports:
      - "${PORT:-3000}:3000"
    # Mapeia o diretório de credenciais para que a sessão não seja perdida ao reiniciar o container
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
    # Habilita suporte a TTY para que o QR Code e logs sejam renderizados corretamente no terminal
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
